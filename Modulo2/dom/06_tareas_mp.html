<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TONY BIBLIOTECA - Gestión de Libros</title>
    <script src="06_tareas.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            background-color: #ecf0f1;
            margin: 5px auto;
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>TONY BIBLIOTECA - Agregar Libros</h1>
    <input type="text" id="tarea" placeholder="Nombre del libro"/>
    <button id="agregar">Agregar Libro</button>
    <ul id="listatareas"></ul>
</body>
</html>
