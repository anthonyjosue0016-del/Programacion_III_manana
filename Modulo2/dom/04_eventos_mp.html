<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TONY BIBLIOTECA - Manejo de Eventos</title>
    <script src="04_eventos.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        #contenedor {
            margin: 20px auto;
            padding: 20px;
            width: 50%;
            min-height: 50px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>TONY BIBLIOTECA - LISTADO DE LIBROS</h1>
    <div id="contenedor">Aquí se mostrarán los libros</div>
    <button id="crear">Agregar Libro</button>
    <button id="eliminar">Eliminar Libro</button>
</body>
</html>
