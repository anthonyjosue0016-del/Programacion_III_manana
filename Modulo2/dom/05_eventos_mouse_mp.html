<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TONY BIBLIOTECA - Eventos de Mouse</title>
    <script src="05_eventos_mouse.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        .caja, .areaTouch {
            width: 200px;
            height: 200px;
            line-height: 200px;
            color: white;
            font-weight: bold;
            margin: 20px auto;
            border-radius: 10px;
            cursor: pointer;
        }
        .caja {
            background-color: #7f8c8d;
        }
        .areaTouch {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <h1>TONY BIBLIOTECA - Práctica con Eventos de Mouse</h1>
    <div id="caja" class="caja">LIBRO DESTACADO</div>
    <div id="areaTouch" class="areaTouch">ÁREA DE INTERACCIÓN</div>
</body>
</html>
