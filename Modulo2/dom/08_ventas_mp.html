<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TONY BIBLIOTECA - Gestor de Libros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
      text-align: center;
    }
    form {
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    .libro {
      background-color: #ecf0f1;
      margin: 10px auto;
      padding: 10px;
      width: 400px;
      border-radius: 5px;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>TONY BIBLIOTECA - Gestor de Libros</h1>

  <form id="formulario">
    <input type="text" id="titulo" placeholder="Título del libro" required>
    <input type="text" id="autor" placeholder="Autor" required>
    <input type="number" id="precio" placeholder="Precio" required>
    <button type="submit">Agregar Libro</button>
  </form>

  <section id="contenedorLibros"></section>

  <script src="08_ventas.js"></script>
</body>
</html>
